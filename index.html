<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Events 2026</title>
  <meta name="theme-color" content="#000000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Noto+Sans+Malayalam:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <!-- CARD 1: TEEN SPACE -->
    <div class="card card-boys" style="--delay: 0s">
      <div class="card-shimmer"></div>
      <img src="teenspace-logo.png" alt="teenspace" class="logo">
      <div class="badge boys">BOYS ONLY</div>
      <p class="audience">10th · +1 · +2 ആൺകുട്ടികൾക്ക്</p>
      <div class="divider"></div>
      <p class="date">2026 ഒക്ടോബർ 18 · ഞായർ</p>
      <p class="venue">ഡ്രീം പാലസ്, പരവൂർ, ഗുരുവായൂർ</p>
    </div>

    <!-- CARD 2: VIDYARTHINI SAMMELANAM -->
    <div class="card card-girls" style="--delay: 0.15s">
      <div class="card-shimmer"></div>
      <h2 class="title-text">തൃശൂർ ജില്ലാ<br>വിദ്യാർത്ഥിനി സമ്മേളനം</h2>
      <div class="badge girls">GIRLS ONLY</div>
      <p class="audience">Class 7 മുതൽ PG വരെ പെൺകുട്ടികൾക്ക്</p>
      <div class="divider"></div>
      <p class="date">2026 നവംബർ 15 · ഞായർ</p>
      <p class="venue">തൃശൂർ</p>
    </div>

  </div>

</body>
</html>
