<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Events 2026</title>
  <meta name="theme-color" content="#ffffff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+Malayalam:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="screen">

    <!-- CARD 1: TEEN SPACE — clickable -->
    <a href="https://teenspacetsr.in" target="_blank" rel="noopener" class="card card-boys" style="--delay: 0s; --accent: 37, 99, 235;">
      <div class="shimmer"></div>
      <div class="card-inner">
        <img src="teenspace-logo.png" alt="teenspace" class="logo">
        <span class="badge">BOYS ONLY · 10th · +1 · +2</span>
        <div class="info">
          <p class="date">2026 ഒക്ടോബർ 18 · ഞായർ</p>
          <p class="venue">ഡ്രീം പാലസ്, പരവൂർ, ഗുരുവായൂർ</p>
        </div>
        <div class="timer" data-target="2026-10-18T09:00:00+05:30">
          <span class="t"><span class="n" data-d>--</span><span class="l">Days</span></span>
          <span class="sep">:</span>
          <span class="t"><span class="n" data-h>--</span><span class="l">Hrs</span></span>
          <span class="sep">:</span>
          <span class="t"><span class="n" data-m>--</span><span class="l">Min</span></span>
          <span class="sep">:</span>
          <span class="t"><span class="n" data-s>--</span><span class="l">Sec</span></span>
        </div>
      </div>
      <span class="tap-hint">Tap to Register →</span>
    </a>

    <!-- CARD 2: GIRLS CONFERENCE — clickable -->
    <a href="https://wisdomgirlstsr.vercel.app/" target="_blank" rel="noopener" class="card card-girls" style="--delay: 0.12s; --accent: 168, 38, 132;">
      <div class="shimmer"></div>
      <div class="card-inner">
        <h2 class="title">തൃശൂർ ജില്ലാ<br>വിദ്യാർത്ഥിനി സമ്മേളനം</h2>
        <span class="badge">GIRLS ONLY · Class 7 to PG</span>
        <div class="info">
          <p class="date">2026 നവംബർ 15 · ഞായർ</p>
          <p class="venue">തൃശൂർ</p>
        </div>
        <div class="timer" data-target="2026-11-15T09:00:00+05:30">
          <span class="t"><span class="n" data-d>--</span><span class="l">Days</span></span>
          <span class="sep">:</span>
          <span class="t"><span class="n" data-h>--</span><span class="l">Hrs</span></span>
          <span class="sep">:</span>
          <span class="t"><span class="n" data-m>--</span><span class="l">Min</span></span>
          <span class="sep">:</span>
          <span class="t"><span class="n" data-s>--</span><span class="l">Sec</span></span>
        </div>
      </div>
      <span class="tap-hint">Tap to Register →</span>
    </a>

  </div>

  <script src="script.js"></script>
</body>
</html>
